name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/**"
      - "tests/**"
      - "scripts/build_docs.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "app/**"
      - "tests/**"
      - "scripts/build_docs.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies from uv.lock
        run: uv sync --locked --all-groups

      - name: Run tests with coverage and build Sphinx documentation
        run: bash scripts/build_docs.sh

      - name: Verify the complete documentation output
        run: |
          set -euo pipefail
          for page in \
            index.html \
            http_api.html \
            python_api.html \
            coverage.html \
            python-api/index.html \
            coverage_html/index.html; do
            test -s "docs/_build/html/${page}" || { echo "Missing ${page}"; exit 1; }
          done
          if grep -rlE '(href|src)="/[^/]' docs/_build/html --include='*.html'; then
            echo "Found root-absolute links; they break under the project Pages URL."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
