[project]
name = "ragdoll"
version = "0.1.0"
description = "A skeleton for a retrieval-augmented generation backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.22",
    "sentence-transformers>=6.3.0",
    "pydantic-settings>=2.16.3",
    "langchain-text-splitters>=1.1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
docs = [
    "sphinx>=9.1.1",
    "sphinx-autoapi>=3.9.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-openapi>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
