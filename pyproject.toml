[project]
name = "ragdoll"
version = "0.1.0"
description = "A skeleton for a retrieval-augmented generation backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.22",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
